services:
  dashboard:
    build: .
    container_name: wa-dashboard
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - .env
    environment:
      DATABASE_SSL: ${DATABASE_SSL:-false}
      NODE_ENV: production
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
